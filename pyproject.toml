[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coremind"
version = "0.4.3"
description = "CoreMind voice assistant framework for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.25",
    "rich>=13.0",
    "typer>=0.12",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.scripts]
coremind = "coremind.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
stt = [
    "faster-whisper>=1.0",
]
tts = [
    "openai>=1.0",
]
wake_word = [
    # openwakeword is NOT listed here because it pulls in tflite-runtime on Linux,
    # which has no pre-built wheel for Pi ARM64 + Python 3.11.
    # Install it manually with --no-deps (see README).
    "onnxruntime>=1.16",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
tools = [
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coremind*"]

[tool.setuptools.package-data]
coremind = ["data/*.json", "data/*.js"]

[tool.pytest.ini_options]
testpaths = ["coremind/tests"]
log_cli = true
log_cli_level = "WARNING"
