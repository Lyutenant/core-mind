[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coremind"
version = "0.1.0"
description = "CoreMind voice assistant framework for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "httpx>=0.25",
    "rich>=13.0",
    "typer>=0.12",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
stt = [
    "faster-whisper>=1.0",
]
tts = [
    "openai>=1.0",
]
wake_word = [
    "openwakeword>=0.6",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["coremind*"]

[tool.pytest.ini_options]
testpaths = ["coremind/tests"]
log_cli = true
log_cli_level = "WARNING"
