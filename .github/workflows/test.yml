name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # sounddevice needs the PortAudio shared library to import (no audio hardware is used).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # Mirrors the dev .venv: server + MCP extras so those tests run instead of skipping.
      # Heavy optional backends (stt, tts, wake_word, vision) stay out; tests don't need them.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,server,tools]'

      - name: Run tests
        run: python -m pytest -q -rs
