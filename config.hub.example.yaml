# CoreMind Hub — Mac Mini configuration
# Copy this file to config.yaml on the Mac Mini, or run `coremind setup` to configure via browser.
#
#   cp config.hub.example.yaml config.yaml

mode: hub   # this device processes STT + LLM + TTS for Nodes

app:
  name: Jarvis        # your assistant's name — must match the Node config
  log_level: INFO
  personality: null   # free-text tone/persona appended to the system prompt, e.g.
                      # "A refined British butler: polite, dry wit, addresses me as 'sir'."
                      # Easiest set from the dashboard (Settings → Application).
  user_location: null   # e.g. "San Francisco, CA" — used as default for weather/time questions
  user_timezone: null   # IANA timezone e.g. "America/Los_Angeles", "Europe/London", "Asia/Tokyo"
  home_airport: null    # ICAO code e.g. "KJYO" — default airport for aviation weather queries
  taf_airport: null     # nearest airport with TAF e.g. "KIAD" (used when home airport lacks TAF)

runtime:
  mode: push_to_talk
  require_confirmation_for_actions: true
  follow_up_seconds: 5.0         # seconds to wait for speech onset before returning to wake word; 0.0 to disable
  follow_up_min_words: 2         # ignore follow-up if transcript is this short (filters background noise)
  post_response_cooldown_seconds: 1.0  # pause after playback before mic reopens (suppresses echo)
  # The first utterance after the wake word must END with one of these terminator words, or it's
  # discarded as a false wake (no reply). Cuts false responses to TV/noise; follow-up turns don't
  # need it. In remote (Node) mode THIS Hub value governs. Set to null or [] to disable.
  wake_confirm_words: ["over", "go ahead", "confirm"]

stt:
  # provider: whisper_local (recommended) or mock (silent, for testing)
  provider: whisper_local
  # Model size — speed vs accuracy on Mac CPU:
  #   tiny            — fastest (~0.5s/clip), ~75 MB download
  #   base            — fast (~1s/clip), ~140 MB download
  #   small           — balanced (~2s/clip), ~460 MB download
  #   medium          — accurate, slower, ~1.5 GB download
  #   distil-large-v3 — near large-v3 accuracy at ~2x its speed, English only,
  #                     ~1.5 GB download  ← recommended if accents/proper nouns
  #                     are misheard on smaller models
  #   large-v3        — most accurate, very slow on CPU, ~3 GB download
  model: distil-large-v3
  language: en
  # Accuracy tuning (whisper_local). The Mac Mini can afford higher settings.
  #   compute_type: int8 (fastest) | int8_float32 | float32 (most accurate)
  #   beam_size:    higher = more accurate, slower (5–8 is a good range)
  #   vad_filter:   strip silence/noise before decoding; cuts pause-hallucinations
  compute_type: int8_float32
  beam_size: 8
  vad_filter: true
  # Bias the decoder toward your vocabulary — the practical substitute for
  # fine-tuning on your own voice. Add the names/jargon Whisper keeps mangling.
  hotwords: "CoreMind, KJYO, KIAD, METAR, TAF, Ollama, Piper, Tailscale"
  initial_prompt: "Aviation and home-assistant voice commands."

tts:
  # provider options:
  #   piper_local — high-quality neural voice; requires model_path below
  #   espeak      — robotic but zero-config; install: brew install espeak-ng
  #   mock        — silent, for testing only
  provider: piper_local
  # Path to a downloaded Piper .onnx voice model file.
  # Both the .onnx and .onnx.json files must be in the same directory.
  # Download voices from https://github.com/rhasspy/piper-voices
  # Example: en_US-amy-medium.onnx, en_US-ryan-high.onnx, en_GB-alan-medium.onnx
  model_path: /Users/yourname/piper-voices/en_US-amy-medium.onnx
  voice: null   # espeak only — voice variant e.g. "en", "en+f3", "en-us"

brain:
  provider: ollama
  timeout_seconds: 90
  allow_mock_fallback: false

ollama:
  base_url: http://localhost:11434   # Ollama runs locally on the Mac Mini
  model: qwen3:8b                    # pull first: ollama pull qwen3:8b
  no_think: true                     # skip chain-of-thought — faster voice responses
  options: {}                        # optional Ollama params: num_predict: 200, temperature: 0.7
  # Vision model for the 'look' tool (camera on the Node). Local — images never leave the Mac.
  # Pull first, e.g.:  ollama pull llava:7b   (or moondream for low RAM, llama3.2-vision for best quality)
  # vision_model: llava:7b

memory:
  enabled: true
  max_turns: 10

tools:
  enabled: true
  # Built-in tools available out of the box (no API key needed):
  #   time             — "What time is it?"
  #   weather          — "What's the weather in Tokyo?" (fetches from wttr.in)
  #   aviation_weather — "What's the METAR at Leesburg?" (NOAA aviationweather.gov)
  #   airport          — "What's the ICAO for Heathrow?" (bundled offline database)
  built_in: [time, weather, airport]
  # Full set including aviation tools:
  # built_in: [time, weather, aviation_weather, airport]
  # Add 'look' to let the assistant see through the Node's camera ("what do you see?").
  # Requires ollama.vision_model above and the Node's vision section enabled.
  # built_in: [time, weather, airport, look]
  #
  # MCP servers — connect to any MCP-compatible server.
  # Requires: pip install 'coremind[tools]'
  #
  # To enable voice-controlled music and ATC streaming on the Pi, uncomment
  # the 'node' entry below and set the Pi's Tailscale IP.
  # Without this, the LLM cannot see the Node's music/ATC tools even if the
  # Pi's node_mcp server is running.
  #
  # mcp_servers:
  #   - name: filesystem        # stdio transport: spawn a local subprocess
  #     transport: stdio
  #     command: ["npx", "@modelcontextprotocol/server-filesystem", "/path/to/docs"]
  #   - name: node              # REQUIRED for music + ATC tools on the Pi
  #     transport: http
  #     url: http://100.x.x.x:8767   # replace with Pi's Tailscale IP (tailscale ip -4)

remote_brain:
  enabled: false   # Hub does not forward to another Hub
  url: ""
  timeout_seconds: 90.0

# --- Settings below are not used by the Hub in remote-brain mode ---
#     They are kept here so the file is valid if you ever run the Hub
#     as a standalone all-in-one assistant.

audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  channels: 1
  record_seconds: 6

vad:
  enabled: false
  energy_threshold: 0.01
  silence_seconds: 1.2
  max_record_seconds: 20.0
  min_speech_seconds: 0.3

wake_word:
  enabled: false
  provider: dummy
  model: hey_jarvis_v0.1
  threshold: 0.5
  vad_threshold: 0.0  # Silero VAD pre-gate (0=off); reduces noise false-wakes without raising threshold
  inference_framework: onnx

openclaw:
  base_url: null
  agent: coremind
