# Complete reference for all available settings.
# For setup, use the role-specific templates or run `coremind setup`:
#
#   Mac Mini (Hub):      cp config.hub.example.yaml config.yaml
#   Raspberry Pi (Node): cp config.node.example.yaml config.yaml

# Device role: hub | node | standalone
mode: hub

app:
  name: Jarvis  # your assistant's name — change to anything you like
  log_level: INFO
  user_location: null   # e.g. "San Francisco, CA" — used as default for weather/time questions
  user_timezone: null   # IANA timezone e.g. "America/Los_Angeles", "Europe/London", "Asia/Tokyo"
  home_airport: null    # ICAO code e.g. "KJYO" — default airport for aviation weather queries
  taf_airport: null     # nearest airport with TAF e.g. "KIAD" (used when home airport lacks TAF)

runtime:
  mode: push_to_talk
  require_confirmation_for_actions: true
  follow_up_seconds: 5.0   # after a response, listen this long for a follow-up; 0.0 to disable
  # First utterance after wake must end with one of these or it's dropped as a false wake; null disables
  wake_confirm_words: ["over", "go ahead", "confirm"]

audio:
  # null = auto-select the mic/speaker by stable name (USB-hub/reboot safe). Or pin an
  # index or name substring from `coremind audio list-devices`, e.g. "USB Audio CODEC".
  input_device: null
  output_device: null
  sample_rate: 16000
  channels: 1
  record_seconds: 6

stt:
  provider: whisper_local     # whisper_local (faster-whisper) | whisper_cpp (whisper.cpp) | mock
  language: en
  # Shared by both engines:
  beam_size: 5                # higher = more accurate, slower; 1 = greedy
  vad_filter: false           # strip silence before decoding (whisper_cpp also needs vad_model_path)
  initial_prompt: null        # context sentence that nudges word choice
  hotwords: null              # words to bias toward; whisper_cpp appends them to initial_prompt
  # whisper_local (faster-whisper) only — pip install 'coremind[stt]':
  model: base                 # tiny | base | small | medium | distil-large-v3 | large-v3
  compute_type: int8          # int8 | int8_float32 | float32
  # whisper_cpp (whisper.cpp, Metal GPU on Mac) only — pip install 'coremind[stt-cpp]':
  whisper_cpp:
    model: large-v3-turbo     # ggml name, downloaded on first use (base.en, small.en, medium.en, large-v3, …)
    model_path: null          # explicit ggml .bin path; wins over model
    n_threads: null           # null = pywhispercpp default
    vad_model_path: null      # Silero ggml VAD model; required for vad_filter (see config.hub.example.yaml)

tts:
  provider: piper_local
  model_path: null
  voice: null

brain:
  provider: ollama
  timeout_seconds: 60
  allow_mock_fallback: false

ollama:
  base_url: http://100.x.x.x:11434
  model: qwen3:8b
  vision_model: null   # e.g. "llava:7b" — enables the 'look' tool; pull first: ollama pull llava:7b
  no_think: false
  options: {}

openclaw:
  base_url: null
  agent: coremind

memory:
  enabled: true
  max_turns: 10

tools:
  enabled: true
  built_in: [time, weather, airport]   # add 'look' for camera vision (needs ollama.vision_model)
  # mcp_servers: []   # Phase B — list of MCP server connections

vad:
  enabled: true
  energy_threshold: 0.01
  silence_seconds: 1.2
  max_record_seconds: 20.0
  min_speech_seconds: 0.3

remote_brain:
  enabled: false
  url: http://100.x.x.x:8765
  timeout_seconds: 90.0

wake_word:
  enabled: false
  provider: dummy
  model: hey_jarvis_v0.1
  threshold: 0.5
  inference_framework: onnx

# Camera (vision) — capture lives on the Node; the Hub runs ollama.vision_model on the frame.
# Enable here + add 'look' to tools.built_in + set ollama.vision_model. Install: pip install 'coremind[vision]'
vision:
  enabled: false
  provider: opencv     # opencv (USB webcam) | mock
  # null = auto-select a camera by its stable /dev/v4l/by-id path. Or pin one:
  #   camera_device: "/dev/v4l/by-id/usb-Foo_Webcam-video-index0"   # preferred (hub-safe)
  #   camera_index: 1
  camera_index: null
  camera_device: null
  resolution_width: 1280
  resolution_height: 720
