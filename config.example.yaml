# Complete reference for all available settings.
# For setup, use the role-specific templates or run `coremind setup`:
#
#   Mac Mini (Hub):      cp config.hub.example.yaml config.yaml
#   Raspberry Pi (Node): cp config.node.example.yaml config.yaml

# Device role: hub | node | standalone
mode: hub

app:
  name: Jarvis  # your assistant's name — change to anything you like
  log_level: INFO

runtime:
  mode: push_to_talk
  require_confirmation_for_actions: true

audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  channels: 1
  record_seconds: 6

stt:
  provider: whisper_local
  model: base
  language: en

tts:
  provider: piper_local
  model_path: null
  voice: null

brain:
  provider: ollama
  timeout_seconds: 60
  allow_mock_fallback: false

ollama:
  base_url: http://100.x.x.x:11434
  model: qwen3:8b
  no_think: false
  options: {}

openclaw:
  base_url: null
  agent: coremind

memory:
  enabled: true
  max_turns: 10

tools:
  enabled: true
  built_in: [time, weather]
  # mcp_servers: []   # Phase B — list of MCP server connections

vad:
  enabled: true
  energy_threshold: 0.01
  silence_seconds: 1.2
  max_record_seconds: 20.0
  min_speech_seconds: 0.3

remote_brain:
  enabled: false
  url: http://100.x.x.x:8765
  timeout_seconds: 90.0

wake_word:
  enabled: false
  provider: dummy
  model: hey_jarvis_v0.1
  threshold: 0.5
  inference_framework: onnx
