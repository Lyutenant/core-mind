app:
  name: Jarvis  # your assistant's name — change to anything you like
  log_level: INFO

runtime:
  mode: push_to_talk
  require_confirmation_for_actions: true

audio:
  # Run `python -m coremind.main audio list-devices` to see available devices.
  # Set to the Index number shown in that table, or leave null to use the system default.
  # Example — USB mic at index 0, USB speaker at index 1:
  #   input_device: 0
  #   output_device: 1
  input_device: null
  output_device: null
  # Use the sample rate your microphone reports in list-devices (e.g. 44100).
  # If the device doesn't natively support 16000 Hz, PortAudio will resample,
  # which can cause recording issues on some Pi audio backends.
  sample_rate: 16000
  channels: 1
  record_seconds: 6

stt:
  provider: whisper_local   # use 'mock' to skip transcription entirely
  # Whisper model size — trade-off between speed and accuracy on Pi 5 CPU:
  #   tiny  — fastest (~1s/clip), least accurate, ~75 MB download
  #   base  — good balance (~2-3s/clip), ~140 MB download  ← recommended
  #   small — slower (~5-8s/clip), more accurate, ~460 MB download
  model: base
  language: en

tts:
  # provider options:
  #   piper_local — high-quality neural voice (recommended); requires model_path below
  #   espeak      — robotic but zero-config; install: sudo apt install espeak-ng
  #   mock        — silent, for testing only
  provider: piper_local
  # piper_local only: path to a downloaded Piper .onnx voice model file.
  # Download voices from https://github.com/rhasspy/piper-voices
  # Example voices: en_US-amy-medium.onnx, en_US-ryan-high.onnx, en_GB-alan-medium.onnx
  # Place the .onnx and .onnx.json files in the same directory.
  # Example: /home/pi/piper-voices/en_US-amy-medium.onnx
  model_path: null
  # espeak only: voice variant (e.g. "en", "en+f3", "en-us"). Leave null for default.
  voice: null

brain:
  provider: ollama
  timeout_seconds: 60
  allow_mock_fallback: false  # set true in dev to continue if Ollama is unreachable

ollama:
  base_url: http://100.x.x.x:11434
  model: qwen3.6:35b-a3b-q4_K_M
  no_think: false   # set true for Qwen3 to skip chain-of-thought — faster voice responses
  options: {}       # arbitrary Ollama inference params, e.g. num_predict: 200, temperature: 0.7

openclaw:
  base_url: null
  agent: coremind

memory:
  enabled: true
  max_turns: 10

vad:
  # Voice Activity Detection — stop recording automatically when you stop speaking.
  # Used by the `run` command; push-to-talk commands use fixed-duration recording.
  enabled: true
  # RMS energy threshold (0.0–1.0). Lower = more sensitive. Raise if background noise triggers speech.
  energy_threshold: 0.01
  # Stop recording after this many seconds of silence.
  silence_seconds: 1.2
  # Hard cap on recording length (seconds).
  max_record_seconds: 20.0
  # Ignore utterances shorter than this (seconds). Filters accidental triggers.
  min_speech_seconds: 0.3

remote_brain:
  # When enabled, the Pi sends audio to the Mac Mini server for STT + LLM + TTS.
  # This offloads the slow CPU work from the Pi, reducing latency significantly.
  # Run on Mac Mini: coremind server  (or: python -m coremind.server)
  # Install server deps on Mac Mini: pip install 'coremind[server]'
  enabled: false
  # Tailscale or LAN IP of the Mac Mini running `coremind server`
  url: http://100.x.x.x:8765
  # How long to wait for the server to respond (seconds). Large models may need 90+s.
  timeout_seconds: 90.0

wake_word:
  # Wake word detection — say a phrase to start a turn instead of pressing Enter.
  # Requires: pip install openwakeword
  # When disabled (or provider: dummy), the `run` command uses press-Enter push-to-talk.
  enabled: false
  # provider: dummy (press Enter) or openwakeword (always-on listening)
  provider: dummy
  # openwakeword built-in models: hey_jarvis_v0.1, hey_mycroft_v0.1, alexa_v0.1
  # Or set to a path to a custom .onnx model file.
  model: hey_jarvis_v0.1
  # Detection confidence threshold (0.0–1.0). Higher = fewer false positives.
  threshold: 0.5
  # Inference backend: "onnx" (recommended — Pi-compatible, uses onnxruntime)
  # or "tflite" (requires tflite_runtime compiled against your NumPy version).
  inference_framework: onnx
